name: Trigger API Deployment

# Agent.Core has no deployment of its own. Agent.API's workflow checks it out
# (actions/checkout with repository: Raviyadav23111998/Agent.Core, ref: the same branch)
# and rsyncs ./core/ to the servers — so the ONLY way a change here reaches a
# machine is by starting that workflow.
#
# ── WHY THIS IS NOT `gh workflow run` ───────────────────────────────────
#
# It was, and it never once worked. The runner had no GitHub
# CLI installed, so every push to this repo produced:
#
#     gh: command not found
#     Error: Process completed with exit code 127
#
# Agent.Core therefore never deployed on its own. Its changes only reached the
# servers when somebody happened to push Agent.API in the same session, because
# THAT workflow pulls this repo fresh — which is luck, not a pipeline. A
# core-only change would sit undeployed behind a job nobody was watching.
#
# curl rather than installing gh: it is present on every runner by definition,
# needs no bootstrap step, and the REST call is the same one gh would have made.
# One less thing that has to be true about the machine.
on:
  push:
    branches: [ "main", "uat" ]
  workflow_dispatch:

jobs:
  trigger-api:
    name: Trigger Agent.API Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Agent.API build
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PAT_TOKEN is not set — Agent.API cannot be triggered, so this change will NOT deploy."
            exit 1
          fi

          echo "Triggering Agent.API workflow for branch: ${BRANCH}"

          # Status and body captured separately: a successful dispatch returns
          # 204 with an EMPTY body, so inspecting the body for errors would read
          # a healthy call as a failure.
          HTTP=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Raviyadav23111998/Agent.API/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\",\"inputs\":{\"branch\":\"${BRANCH}\"}}")

          if [ "$HTTP" != "204" ]; then
            echo "::error::Agent.API dispatch failed with HTTP ${HTTP} — this change will NOT deploy."
            cat /tmp/dispatch.out || true
            exit 1
          fi

          echo "✅ Agent.API workflow dispatched for ${BRANCH} — core/ ships with that run."
